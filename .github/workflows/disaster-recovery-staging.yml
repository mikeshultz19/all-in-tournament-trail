name: Staging registration disaster recovery

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: aitt-staging-disaster-recovery
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.AITT_DR_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aitt-staging-dr
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Process staging DR outbox
        env:
          AITT_DR_STAGING_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.AITT_DR_STAGING_GOOGLE_SERVICE_ACCOUNT_JSON }}
          AITT_DR_STAGING_GOOGLE_SHEET_ID: ${{ secrets.AITT_DR_STAGING_GOOGLE_SHEET_ID }}
          AITT_DR_STAGING_SUPABASE_URL: ${{ secrets.AITT_DR_STAGING_SUPABASE_URL }}
          AITT_DR_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.AITT_DR_STAGING_SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/disaster-recovery-sync.ts
